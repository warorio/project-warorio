<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout lab</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      margin: 0;
    }

    header, footer {
      background: #1a2a3a;
      color: #ffffff;
      padding: 16px;
    }

    .columns {
      display: flex;
      gap: 24px;
      padding: 16px;
    }

    .columns section {
      flex: 1;
      min-width: 280px;
      border: 2px solid #b45f06;
      border-radius: 8px;
      padding: 16px;
    }

    /* Your fix goes below this line */

  </style>
</head>
<body>
  <header>
    <h1>Layout lab</h1>
  </header>

  <main class="columns">
    <section>
      <h2>Left box</h2>
      <p>On a laptop, this box sits on the left.</p>
    </section>
    <section>
      <h2>Right box</h2>
      <p>On a laptop, this box sits on the right.</p>
    </section>
  </main>
</html>
