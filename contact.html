<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us</title>
  <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About  the movement</a>
      <a href="more.html">Educational materials and social center</a>
      <a href="contact.html">Contacts</a>
    </nav>
  <style>
    :root {
      --bg: #eef1f5;
      --surface: #ffffff;
      --ink: #14213d;
      --muted: #5a6478;
      --line: #cdd4e0;
      --accent: #2b50e6;
      --accent-ink: #ffffff;
      --error: #b3261e;
      --success: #1b7f4b;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1626;
        --surface: #172036;
        --ink: #e8ecf5;
        --muted: #9aa5bd;
        --line: #2c3857;
        --accent: #6f8cff;
        --accent-ink: #0f1626;
        --error: #ff8a80;
        --success: #5fd69a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 3rem;
      align-items: start;
    }

    .intro h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 1rem;
    }
    .intro p { color: var(--muted); max-width: 36ch; margin: 0 0 2rem; }

    .details { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
    .details strong { display: block; font-size: 0.95rem; }
    .details a, .details span { color: var(--muted); text-decoration: none; }
    .details a:hover { color: var(--accent); text-decoration: underline; }

    form {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 2rem;
      display: grid;
      gap: 1.25rem;
    }

    .field { display: grid; gap: 0.4rem; }
    label { font-weight: 600; font-size: 0.95rem; }

    input, textarea, select {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.7rem 0.8rem;
    }
    textarea { min-height: 150px; resize: vertical; }

    input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .field.invalid input,
    .field.invalid textarea { border-color: var(--error); }
    .error-msg { color: var(--error); font-size: 0.85rem; min-height: 1.1em; }

    .hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }

    button {
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 6px;
      padding: 0.85rem 1.25rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      border-radius: 6px;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      display: none;
    }
    .status.show { display: block; }
    .status.ok  { border: 1px solid var(--success); color: var(--success); }
    .status.bad { border: 1px solid var(--error);   color: var(--error); }

    @media (max-width: 760px) {
      .wrap { grid-template-columns: 1fr; gap: 2rem; }
      form { padding: 1.25rem; }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <section class="intro">
      <h1>Send us a message</h1>
      <p>Tell us what you need and we will reply by email, usually within one business day.</p>

      <ul class="details">
        <li>
          <strong>Email</strong>
          <a href="prince.kiama@student.moringaschool.com">prince.kiama@student.moringaschool.com</a>
        </li>
        <li>
          <strong>Phone</strong>
          <a href="tel:+254184611951">0184611951</a>
        </li>
        <li>
          <strong>Hours</strong>
          <span>Thursday, 8:00–17:00 EAT</span>
        </li>
      </ul>
    </section>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="name">Prince Kiama</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <span class="error-msg" data-for="name"></span>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="error-msg" data-for="email"></span>
      </div>

      <div class="field">
        <label for="subject">Topic</label>
        <select id="subject" name="subject">
          <option>General question</option>
          <option>Support</option>
          <option>Sales</option>
          <option>Partnership</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required minlength="10"></textarea>
        <span class="error-msg" data-for="message"></span>
      </div>

      <!-- Honeypot spam trap (leave empty) -->
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="submit-btn">Send message</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>

  </main>

  <script>
    /* SETUP: replace with your Formspree URL (https://formspree.io/f/xxxx)
       or use Web3Forms: ENDPOINT = "https://api.web3forms.com/submit"
       and put your access key in WEB3FORMS_KEY. */
    const ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";
    const WEB3FORMS_KEY = "";

    const form = document.getElementById("contact-form");
    const btn = document.getElementById("submit-btn");
    const statusBox = document.getElementById("status");

    function showStatus(message, ok) {
      statusBox.textContent = message;
      statusBox.className = "status show " + (ok ? "ok" : "bad");
    }

    function setError(input, message) {
      const field = input.closest(".field");
      field.classList.toggle("invalid", Boolean(message));
      field.querySelector(".error-msg").textContent = message || "";
    }

    function validate() {
      let valid = true;
      const name = form.name, email = form.email, message = form.message;

      if (!name.value.trim()) { setError(name, "Enter your name."); valid = false; }
      else setError(name, "");

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
        setError(email, "Enter a valid email address, like name@example.com."); valid = false;
      } else setError(email, "");

      if (message.value.trim().length < 10) {
        setError(message, "Write at least 10 characters so we can help."); valid = false;
      } else setError(message, "");

      return valid;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status";

      if (form._gotcha.value) { form.reset(); return; }
      if (!validate()) return;

      if (ENDPOINT.includes("YOUR_FORM_ID")) {
        showStatus("Add your Formspree or Web3Forms details in the script section first.", false);
        return;
      }

      const data = new FormData(form);
      if (WEB3FORMS_KEY) data.append("access_key", WEB3FORMS_KEY);

      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" }
        });
        const result = await response.json().catch(() => ({}));

        if (response.ok && result.success !== false) {
          form.reset();
          showStatus("Message sent. We will reply to your email soon.", true);
        } else {
          showStatus(result.message || "The message was not sent. Check your details and try again.", false);
        }
      } catch (err) {
        showStatus("Could not reach the server. Check your connection and try again.", false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
