<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts | Project Warorio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      border-top: 5px solid #4a3238;
      background: #ffffff;
      color: #1a1a1a;
      font-family: Verdana, Geneva, "DejaVu Sans", sans-serif;
      line-height: 1.5;
    }

    /* ---------- Header ---------- */
    header {
      background: #7f9c73;
      padding: 1.1rem 1rem 1.2rem 1.1rem;
    }

    header h1 {
      margin: 0 0 1.1rem;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffa500;
    }

    nav { display: flex; flex-wrap: wrap; gap: 0.6rem; padding-left: 0.9rem; }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.18);
    }
    nav a:hover,
    nav a[aria-current="page"] { background: #ffa500; color: #1a1a1a; }

    /* ---------- Main content ---------- */
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2.25rem 1rem 3rem;
    }

    main h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 1.25rem;
    }

    main p {
      font-size: 1.1rem;
      line-height: 1.75;
      margin: 0 0 1.5rem;
    }

    /* ---------- Contact details ---------- */
    .details {
      list-style: none;
      margin: 0 0 2.25rem;
      padding: 0;
      display: grid;
      gap: 0.9rem;
    }
    .details strong { display: block; font-size: 1.05rem; }
    .details a, .details span { font-size: 1.05rem; color: #1a1a1a; }
    .details a { color: #4f6b44; }
    .details a:hover { color: #ffa500; }

    /* ---------- Form ---------- */
    form { display: grid; gap: 1.1rem; }

    .field { display: grid; gap: 0.35rem; }

    label { font-size: 1.05rem; font-weight: 700; }

    input, textarea, select {
      width: 100%;
      font: inherit;
      font-size: 1.05rem;
      color: #1a1a1a;
      background: #ffffff;
      border: 1px solid #7f9c73;
      border-radius: 4px;
      padding: 0.65rem 0.75rem;
    }
    textarea { min-height: 160px; resize: vertical; }

    input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, nav a:focus-visible {
      outline: 3px solid #ffa500;
      outline-offset: 2px;
    }

    .field.invalid input,
    .field.invalid textarea { border-color: #b3261e; }
    .error-msg { color: #b3261e; font-size: 0.9rem; min-height: 1.1em; }

    .hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }

    button {
      justify-self: start;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      background: #7f9c73;
      border: 0;
      border-radius: 4px;
      padding: 0.8rem 1.75rem;
      cursor: pointer;
    }
    button:hover { background: #6d8962; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status { display: none; padding: 0.8rem 1rem; border-radius: 4px; font-size: 1rem; }
    .status.show { display: block; }
    .status.ok  { border: 1px solid #2e7d32; color: #2e7d32; }
    .status.bad { border: 1px solid #b3261e; color: #b3261e; }

    @media (max-width: 640px) {
      header h1 { font-size: 1.7rem; }
      nav { padding-left: 0; }
      nav a { font-size: 1rem; padding: 0.45rem 0.9rem; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Project Warorio</h1>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About the movement</a>
      <a href="more.html">Educational materials and social center</a>
      <a href="contact.html" aria-current="page">Contacts</a>
    </nav>
  </header>

  <main>
    <h2>Send us a message</h2>
    <p>Tell us what you need and we will reply by email, usually within one business day.</p>

    <ul class="details">
      <li>
        <strong>Email</strong>
        <a href="mailto:prince.kiama@student.moringaschool.com">prince.kiama@student.moringaschool.com</a>
      </li>
      <li>
        <strong>Phone</strong>
        <a href="tel:+254184611951">0184611951</a>
      </li>
      <li>
        <strong>Hours</strong>
        <span>Thursday, 8:00–17:00 EAT</span>
      </li>
    </ul>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <span class="error-msg"></span>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="error-msg"></span>
      </div>

      <div class="field">
        <label for="subject">Topic</label>
        <select id="subject" name="subject">
          <option>General question</option>
          <option>Support</option>
          <option>Sales</option>
          <option>Partnership</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required minlength="10"></textarea>
        <span class="error-msg"></span>
      </div>

      <!-- Honeypot spam trap (leave empty) -->
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="submit-btn">Send message</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    /* SETUP: replace with your Formspree URL (https://formspree.io/f/xxxx)
       or use Web3Forms: ENDPOINT = "https://api.web3forms.com/submit"
       and put your access key in WEB3FORMS_KEY. */
    const ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";
    const WEB3FORMS_KEY = "";

    const form = document.getElementById("contact-form");
    const btn = document.getElementById("submit-btn");
    const statusBox = document.getElementById("status");

    function showStatus(message, ok) {
      statusBox.textContent = message;
      statusBox.className = "status show " + (ok ? "ok" : "bad");
    }

    function setError(input, message) {
      const field = input.closest(".field");
      field.classList.toggle("invalid", Boolean(message));
      field.querySelector(".error-msg").textContent = message || "";
    }

    function validate() {
      let valid = true;
      const { name, email, message } = form;

      if (!name.value.trim()) { setError(name, "Enter your name."); valid = false; }
      else setError(name, "");

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
        setError(email, "Enter a valid email address, like name@example.com."); valid = false;
      } else setError(email, "");

      if (message.value.trim().length < 10) {
        setError(message, "Write at least 10 characters so we can help."); valid = false;
      } else setError(message, "");

      return valid;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status";

      if (form._gotcha.value) { form.reset(); return; }
      if (!validate()) return;

      if (ENDPOINT.includes("YOUR_FORM_ID")) {
        showStatus("Add your Formspree or Web3Forms details in the script section first.", false);
        return;
      }

      const data = new FormData(form);
      if (WEB3FORMS_KEY) data.append("access_key", WEB3FORMS_KEY);

      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" }
        });
        const result = await response.json().catch(() => ({}));

        if (response.ok && result.success !== false) {
          form.reset();
          showStatus("Message sent. We will reply to your email soon.", true);
        } else {
          showStatus(result.message || "The message was not sent. Check your details and try again.", false);
        }
      } catch (err) {
        showStatus("Could not reach the server. Check your connection and try again.", false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
